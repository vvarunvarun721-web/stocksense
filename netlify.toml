[build]
  command = "echo Building StockSense API functions"
  publish = "netlify/public"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "playwright", "playwright-core"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true